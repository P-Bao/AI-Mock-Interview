services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cv-module-backend
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: cv-module-redis
    ports:
      - "6379:6379"
